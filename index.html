<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Φιλαρμονική Ορχήστρα Θήβας</title>
    <!-- Tailwind CSS for modern mobile-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta name="theme-color" content="#1e293b">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- APP CONTAINER -->
    <div id="app" class="max-w-md mx-auto w-full flex-1 flex flex-col justify-between p-4">
        
        <!-- DYNAMIC CONTENT AREA -->
        <div id="content" class="flex-1 pb-16">
            <!-- Loaded dynamically via JavaScript -->
        </div>

        <!-- NAVIGATION BAR (Visible when logged in) -->
        <nav id="navbar" class="hidden fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 flex justify-around p-3 max-w-md mx-auto z-50">
            <button onclick="switchTab('music')" id="nav-music" class="text-indigo-400 font-medium text-sm">Παρτιτούρες</button>
            <button onclick="switchTab('events')" id="nav-events" class="text-slate-400 font-medium text-sm">Εκδηλώσεις</button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-slate-400 font-medium text-sm">Προφίλ</button>
        </nav>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        const SUPABASE_URL = 'https://jigwfebaxiqumrltkgli.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ORpUPeW5OSBOwTCTIKhPUw_SX8DtV9Z';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;
        let eventsViewMode = 'list'; // 'list' or 'calendar'
        let selectedCalendarDate = null; // 'YYYY-MM-DD' format if a day is clicked

        async function init() {
            if (window.location.hash.includes('type=invite') || window.location.hash.includes('type=recovery')) {
                renderSetPasswordScreen();
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchProfile();
                renderApp();
            } else {
                renderLogin();
            }

            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (event === 'PASSWORD_RECOVERY' || window.location.hash.includes('type=invite')) {
                    renderSetPasswordScreen();
                    return;
                }

                if (session) {
                    currentUser = session.user;
                    await fetchProfile();
                    renderApp();
                } else {
                    currentUser = null;
                    currentProfile = null;
                    renderLogin();
                }
            });
        }

        async function fetchProfile() {
            if (!currentUser) return;
            
            let { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (!data && currentUser.email) {
                const { data: dataByEmail } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('email', currentUser.email)
                    .single();
                if (dataByEmail) data = dataByEmail;
            }

            if (data) currentProfile = data;
        }

        function renderLogin() {
            document.getElementById('navbar').classList.add('hidden');
            document.getElementById('content').innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[80vh] text-center">
                    <h1 class="text-2xl font-bold text-indigo-400 mb-2">Φιλαρμονική Ορχήστρα Θήβας</h1>
                    <p class="text-slate-400 mb-6 text-sm">Συνδεθείτε για να δείτε τις παρτιτούρες σας και το πρόγραμμα.</p>
                    <div class="w-full bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                        <input type="email" id="email" placeholder="Διεύθυνση Email" class="w-full mb-3 p-3 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-indigo-500">
                        <input type="password" id="password" placeholder="Κωδικός πρόσβασης" class="w-full mb-4 p-3 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-indigo-500">
                        <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold p-3 rounded-lg transition text-sm">Σύνδεση</button>
                    </div>
                    <p id="error-msg" class="text-red-400 mt-4 text-sm"></p>
                </div>
            `;
        }

        function renderSetPasswordScreen() {
            document.getElementById('navbar').classList.add('hidden');
            document.getElementById('content').innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[80vh] text-center">
                    <h1 class="text-2xl font-bold text-indigo-400 mb-2">Δημιουργία Κωδικού Πρόσβασης</h1>
                    <p class="text-slate-400 mb-6 text-sm">Καλώς ήρθατε! Ορίστε τον κωδικό πρόσβασής σας για να ολοκληρώσετε την εγγραφή σας στην εφαρμογή.</p>
                    <div class="w-full bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                        <input type="password" id="new-password" placeholder="Νέος Κωδικός (τουλάχιστον 6 χαρακτήρες)" class="w-full mb-4 p-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 text-sm">
                        <button onclick="handleSetPassword()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold p-3 rounded-lg transition text-sm">Αποθήκευση & Είσοδος</button>
                    </div>
                    <p id="password-error-msg" class="text-red-400 mt-4 text-sm"></p>
                </div>
            `;
        }

        async function handleSetPassword() {
            const password = document.getElementById('new-password').value;
            if (!password || password.length < 6) {
                document.getElementById('password-error-msg').innerText = 'Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.';
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({ password });
            if (error) {
                document.getElementById('password-error-msg').innerText = error.message;
            } else {
                alert('Ο κωδικός αποθηκεύτηκε επιτυχώς!');
                window.location.hash = '';
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    currentUser = session.user;
                    await fetchProfile();
                    renderApp();
                }
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('error-msg').innerText = 'Λανθασμένο email ή κωδικός πρόσβασης.';
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
        }

        let activeTab = 'music';
        function switchTab(tab) {
            activeTab = tab;
            renderApp();
        }

        async function renderApp() {
            document.getElementById('navbar').classList.remove('hidden');
            ['music', 'events', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === activeTab) {
                    btn.className = "text-indigo-400 font-bold text-sm";
                } else {
                    btn.className = "text-slate-400 font-medium text-sm";
                }
            });

            if (activeTab === 'music') renderMusicTab();
            else if (activeTab === 'events') renderEventsTab();
            else if (activeTab === 'profile') renderProfileTab();
        }

        // --- MUSIC TAB ---
        async function renderMusicTab() {
            const content = document.getElementById('content');
            content.innerHTML = `<h2 class="text-2xl font-bold mb-4">Παρτιτούρες</h2><p class="text-slate-400 text-sm">Φόρτωση βιβλιοθήκης...</p>`;

            const { data: music, error } = await supabaseClient.from('music_library').select('*');

            if (error) {
                content.innerHTML = `<p class="text-red-400 text-sm">Σφάλμα φόρτωσης: ${error.message}</p>`;
                return;
            }

            let html = `<h2 class="text-2xl font-bold mb-1">Παρτιτούρες</h2>`;
            html += `<p class="text-xs text-indigo-300 mb-4">Φιλτραρισμένο για το όργανό σας: <b>${currentProfile?.instrument || 'Μη ορισμένο'}</b></p>`;

            if (!music || music.length === 0) {
                html += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center text-slate-400 text-sm">Δεν υπάρχουν διαθέσιμες παρτιτούρες ακόμα.</div>`;
            } else {
                html += `<div class="space-y-3">`;
                music.forEach(item => {
                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-base text-white">${item.piece_title}</h3>
                                <p class="text-xs text-slate-400">${item.composer || 'Άγνωστος Συνθέτης'} • Σετ: ${item.concert_set || 'Γενικό'}</p>
                            </div>
                            <a href="${item.pdf_link}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-2 rounded-lg text-xs font-semibold transition shrink-0 ml-2">PDF</a>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            if (currentProfile?.role === 'admin') {
                html += `
                    <div class="mt-8 bg-slate-800 p-4 rounded-xl border border-slate-700">
                        <h3 class="font-bold text-sm text-indigo-400 mb-3">Διαχειριστής: Προσθήκη Παρτιτούρας</h3>
                        <input type="text" id="m-title" placeholder="Τίτλος Κομματιού" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="m-composer" placeholder="Συνθέτης" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="m-set" placeholder="Σετ Συναυλίας (π.χ., Παρέλαση 28ης)" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="m-part" placeholder="Όργανο / Μέρος (π.χ., Φλάουτο 1)" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="m-link" placeholder="Σύνδεσμος Google Drive (PDF)" class="w-full mb-3 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <button onclick="addMusic()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded font-semibold text-sm">Προσθήκη στη Βιβλιοθήκη</button>
                    </div>
                `;
            }

            content.innerHTML = html;
        }

        async function addMusic() {
            const piece_title = document.getElementById('m-title').value;
            const composer = document.getElementById('m-composer').value;
            const concert_set = document.getElementById('m-set').value;
            const instrument_part = document.getElementById('m-part').value;
            const pdf_link = document.getElementById('m-link').value;

            const { error } = await supabaseClient.from('music_library').insert([{ piece_title, composer, concert_set, instrument_part, pdf_link }]);
            if (error) alert(error.message);
            else {
                alert('Η παρτιτούρα προστέθηκε επιτυχώς!');
                renderMusicTab();
            }
        }

        // --- EVENTS TAB WITH GREEK DATES & MAP LINKS ---
        async function renderEventsTab() {
            const content = document.getElementById('content');
            content.innerHTML = `<h2 class="text-2xl font-bold mb-4">Εκδηλώσεις</h2><p class="text-slate-400 text-sm">Φόρτωση προγράμματος...</p>`;

            const { data: events } = await supabaseClient.from('band_events').select('*').order('date_time', { ascending: true });
            const { data: responses } = await supabaseClient.from('event_responses').select('*').eq('user_email', currentProfile.email);

            let html = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Πρόγραμμα</h2>
                    <div class="bg-slate-800 p-1 rounded-lg border border-slate-700 flex space-x-1">
                        <button onclick="setEventsView('list')" class="px-3 py-1 rounded text-xs font-medium transition ${eventsViewMode === 'list' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}">Λίστα</button>
                        <button onclick="setEventsView('calendar')" class="px-3 py-1 rounded text-xs font-medium transition ${eventsViewMode === 'calendar' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}">Ημερολόγιο</button>
                    </div>
                </div>
            `;

            if (eventsViewMode === 'calendar') {
                html += renderCalendarGrid(events);
            }

            let displayedEvents = events || [];
            if (eventsViewMode === 'calendar' && selectedCalendarDate) {
                displayedEvents = displayedEvents.filter(ev => ev.date_time.startsWith(selectedCalendarDate));
                html += `
                    <div class="flex justify-between items-center bg-slate-800/60 p-2.5 rounded-lg border border-slate-700 mb-3 text-xs">
                        <span class="text-indigo-300">📅 Προβολή ημέρας: <b>${formatGreekDateOnly(selectedCalendarDate)}</b></span>
                        <button onclick="selectedCalendarDate = null; renderEventsTab();" class="text-slate-400 hover:text-white underline">Εμφάνιση όλων</button>
                    </div>
                `;
            }

            if (!displayedEvents || displayedEvents.length === 0) {
                html += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center text-slate-400 text-sm">Δεν υπάρχουν προγραμματισμένες εκδηλώσεις.</div>`;
            } else {
                html += `<div class="space-y-4">`;
                displayedEvents.forEach(ev => {
                    const rawResp = responses?.find(r => r.event_id === ev.id)?.status;
                    let displayResp = 'Χωρίς απάντηση';
                    if (rawResp === 'Going') displayResp = 'Θα παρευρεθώ ✅';
                    else if (rawResp === 'Not Going') displayResp = 'Δεν θα μπορέσω ❌';

                    // Format date strictly in Greek standard format (DD/MM/YYYY, HH:MM)
                    const formattedDate = new Date(ev.date_time).toLocaleString('el-GR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    // Handle location / Google Maps link formatting
                    let locationHtml = ev.location || 'Θα ανακοινωθεί';
                    if (ev.location && (ev.location.startsWith('http://') || ev.location.startsWith('https://'))) {
                        locationHtml = `<a href="${ev.location}" target="_blank" class="text-indigo-400 hover:underline inline-flex items-center">🗺️ Άνοιγμα στους Χάρτες (Google Maps)</a>`;
                    }

                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <h3 class="font-bold text-base text-white mb-1">${ev.event_name}</h3>
                            <p class="text-xs text-indigo-300 mb-1">📅 ${formattedDate}</p>
                            <p class="text-xs text-slate-400 mb-2">📍 ${locationHtml} | 👔 Ενδυμασία: ${ev.dress_code || 'Καθημερινή'}</p>
                            ${ev.notes ? `<p class="text-xs bg-slate-900 p-2.5 rounded mb-3 text-slate-300">${ev.notes}</p>` : ''}
                            
                            <div class="flex items-center justify-between border-t border-slate-700 pt-3">
                                <span class="text-xs text-slate-400">Κατάσταση: <b class="text-white">${displayResp}</b></span>
                                <div class="space-x-1">
                                    <button onclick="rsvp(${ev.id}, 'Going')" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded text-xs font-semibold transition">Ναι</button>
                                    <button onclick="rsvp(${ev.id}, 'Not Going')" class="px-2.5 py-1.5 bg-red-600/80 hover:bg-red-600 rounded text-xs font-semibold transition">Όχι</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            if (currentProfile?.role === 'admin') {
                html += `
                    <div class="mt-8 bg-slate-800 p-4 rounded-xl border border-slate-700">
                        <h3 class="font-bold text-sm text-indigo-400 mb-3">Διαχειριστής: Νέα Εκδήλωση</h3>
                        <input type="text" id="e-name" placeholder="Όνομα Εκδήλωσης (π.χ., Πρόβα / Λιτανεία)" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="datetime-local" id="e-date" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="e-loc" placeholder="Τοποθεσία ή Σύνδεσμος Google Maps URL" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="e-dress" placeholder="Ενδυμασία (π.χ., Στολή Παρέλασης)" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <textarea id="e-notes" placeholder="Επιπλέον σημειώσεις..." class="w-full mb-3 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white"></textarea>
                        <button onclick="addEvent()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded font-semibold text-sm">Προγραμματισμός</button>
                    </div>
                `;
            }

            content.innerHTML = html;
        }

        function setEventsView(mode) {
            eventsViewMode = mode;
            selectedCalendarDate = null;
            renderEventsTab();
        }

        function formatGreekDateOnly(dateStr) {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        }

        function renderCalendarGrid(events) {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();

            const firstDayIndex = new Date(year, month, 1).getDay();
            const startingDay = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;
            const totalDays = new Date(year, month + 1, 0).getDate();

            const monthNames = ["Ιανουάριος", "Φεβρουάριος", "Μάρτιος", "Απρίλιος", "Μάιος", "Ιούνιος", "Ιούλιος", "Αύγουστος", "Σεπτέμβριος", "Οκτώβριος", "Νοέμβριος", "Δεκέμβριος"];
            
            const eventDatesSet = new Set();
            if (events) {
                events.forEach(ev => {
                    const dateStr = ev.date_time.split('T')[0];
                    eventDatesSet.add(dateStr);
                });
            }

            let html = `
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-4">
                    <div class="text-center font-bold text-sm text-indigo-300 mb-3">${monthNames[month]} ${year}</div>
                    <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-2">
                        <div>Δευ</div><div>Τρι</div><div>Τετ</div><div>Πεμ</div><div>Παρ</div><div>Σαβ</div><div>Κυρ</div>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-xs">
            `;

            for (let i = 0; i < startingDay; i++) {
                html += `<div></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayStr = String(day).padStart(2, '0');
                const monthStr = String(month + 1).padStart(2, '0');
                const fullDateStr = `${year}-${monthStr}-${dayStr}`;
                const hasEvent = eventDatesSet.has(fullDateStr);

                let btnClass = "py-2 rounded transition font-medium ";
                if (hasEvent) {
                    btnClass += "bg-indigo-600 text-white font-bold shadow hover:bg-indigo-500 cursor-pointer";
                } else {
                    btnClass += "text-slate-300 hover:bg-slate-700/50";
                }

                if (selectedCalendarDate === fullDateStr) {
                    btnClass = "py-2 rounded bg-emerald-600 text-white font-bold ring-2 ring-white cursor-pointer";
                }

                html += `<button onclick="filterByDate('${fullDateStr}')" class="${btnClass}">${day}</button>`;
            }

            html += `</div></div>`;
            return html;
        }

        function filterByDate(dateStr) {
            selectedCalendarDate = dateStr;
            renderEventsTab();
        }

        async function rsvp(eventId, status) {
            const { data: existing } = await supabaseClient
                .from('event_responses')
                .select('*')
                .eq('event_id', eventId)
                .eq('user_email', currentProfile.email)
                .single();

            if (existing) {
                await supabaseClient.from('event_responses').update({ status }).eq('id', existing.id);
            } else {
                await supabaseClient.from('event_responses').insert([{ event_id: eventId, user_email: currentProfile.email, status }]);
            }
            renderEventsTab();
        }

        async function addEvent() {
            const event_name = document.getElementById('e-name').value;
            const date_time = document.getElementById('e-date').value;
            const location = document.getElementById('e-loc').value;
            const dress_code = document.getElementById('e-dress').value;
            const notes = document.getElementById('e-notes').value;

            const { error } = await supabaseClient.from('band_events').insert([{ event_name, date_time, location, dress_code, notes }]);
            if (error) alert(error.message);
            else {
                alert('Η εκδήλωση προστέθηκε!');
                renderEventsTab();
            }
        }

        // --- PROFILE TAB ---
        function renderProfileTab() {
            const content = document.getElementById('content');
            let roleDisplay = currentProfile?.role === 'admin' ? 'Διαχειριστής' : 'Μουσικός';
            
            const firstName = currentProfile?.first_name || currentProfile?.name || '';
            const lastName = currentProfile?.last_name || '';
            const instrument = currentProfile?.instrument || 'Μη ορισμένο';

            content.innerHTML = `
                <h2 class="text-2xl font-bold mb-4">Το Προφίλ μου</h2>
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3 mb-4">
                    <div>
                        <span class="text-xs text-slate-400 block">Όνομα</span>
                        <p class="text-base font-semibold text-white">${firstName || '—'}</p>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">Επώνυμο</span>
                        <p class="text-base font-semibold text-white">${lastName || '—'}</p>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">Όργανο / Μέρος</span>
                        <p class="text-base font-semibold text-indigo-300">${instrument}</p>
                    </div>
                    <div class="pt-2 border-t border-slate-700">
                        <span class="text-xs text-slate-400 block">Email</span>
                        <p class="text-sm text-slate-300">${currentProfile?.email || currentUser?.email}</p>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">Ρόλος Συστήματος</span>
                        <span class="inline-block mt-1 uppercase text-xs bg-slate-900 px-2.5 py-1 rounded text-emerald-400 font-medium">${roleDisplay}</span>
                    </div>
                </div>
                <button onclick="handleLogout()" class="w-full bg-red-600/80 hover:bg-red-600 text-white font-semibold p-3 rounded-lg transition text-sm">Αποσύνδεση</button>
            `;
        }

        window.onload = init;
    </script>
