        function urlB64ToUint8Array(base64String) {
            if (!base64String || base64String === 'PASTE_YOUR_VAPID_PUBLIC_KEY_HERE') return null;
            try {
                const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
                const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
                const rawData = window.atob(base64);
                const outputArray = new Uint8Array(rawData.length);
                for (let i = 0; i < rawData.length; ++i) {
                    outputArray[i] = rawData.charCodeAt(i);
                }
                return outputArray.length === 65 ? outputArray : null;
            } catch {
                return null;
            }
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function safeExternalUrl(value) {
            try {
                const url = new URL(String(value));
                return ['http:', 'https:'].includes(url.protocol) ? escapeHtml(url.href) : '#';
            } catch {

            }

        function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) return Promise.resolve(null);
            if (serviceWorkerRegistration) return serviceWorkerRegistration;

            serviceWorkerRegistration = navigator.serviceWorker.register('./sw.js')
                .then(reg => {
                    console.log('Service Worker registered:', reg.scope);
                    return reg;
                })
                .catch(err => {
                    serviceWorkerRegistration = null;
                    console.warn('Service Worker registration failed:', err);
                    return null;
                });
            return serviceWorkerRegistration;
        }

        async function initPushSupport() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
            try {
                const reg = await registerServiceWorker();
                if (!reg) return;
                pushSubscription = await reg.pushManager.getSubscription();
            } catch (e) {
                console.warn('Push init failed:', e);
            }
        }

        async function fetchProfile() {

                .from('profiles')

            if (!data && currentUser.email) {
                const { data: dataByEmail } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('email', currentUser.email)

                if (dataByEmail) data = dataByEmail;

            } else {
                currentProfile = { email: currentUser.email, role: 'musician', instrument: 'Μη ορισμένο' };
            }
        }

        function getGreekVocativeName(name) {
            const trimmedName = (name || '').trim();
            if (!trimmedName) return 'μουσικέ';

            const normalizedName = trimmedName.toLocaleLowerCase('el-GR');
            const irregularForms = {
                'βασίλης': 'Βασίλη',
                'γιαννης': 'Γιάννη',
                'γιάννης': 'Γιάννη',
                'δημήτρης': 'Δημήτρη',
                'δημητρης': 'Δημήτρη',
                'γιώργος': 'Γιώργο',
                'γεώργιος': 'Γεώργιε',
                'νίκος': 'Νίκο',
                'παναγιώτης': 'Παναγιώτη',
                'χρήστος': 'Χρήστο',
                'κωνσταντίνος': 'Κωνσταντίνε',
                'ανδρέας': 'Ανδρέα',
                'λουκάς': 'Λουκά'
            };
            if (irregularForms[normalizedName]) return irregularForms[normalizedName];

            if (normalizedName.endsWith('ης')) {
                return trimmedName.slice(0, -1);
            }
            if (normalizedName.endsWith('ος')) {
                return trimmedName.slice(0, -1);
            }
            if (normalizedName.endsWith('ας')) {
                return trimmedName.slice(0, -1);
            }

            return trimmedName;
        }

        async function addMusic() {
            const piece_title = document.getElementById('m-title').value;
            const composer = document.getElementById('m-composer').value;
            const concert_set = document.getElementById('m-set').value;

            }

            const file = fileInput.files[0];

            const { error: uploadError } = await supabaseClient.storage
                .from('sheet-music')
                .upload(filePath, file);

        async function openSecurePdf(filePath, pieceId) {
            filePath = decodeURIComponent(filePath);
            const { data, error } = await supabaseClient.storage
                .from('sheet-music')
                .createSignedUrl(filePath, 60);

            if (error || !data?.signedUrl) {
                alert('Σφάλμα πρόσβασης στο αρχείο: ' + (error?.message || 'Άγνωστο σφάλμα'));
                return;
            }

            openPdfViewer(data.signedUrl, pieceId);
        }

        async function openPdfViewer(pdfUrl, pieceId) {
            activePieceId = pieceId;
            pageNum = 1;
            document.getElementById('pdf-viewer-container').classList.remove('hidden');
            document.getElementById('pdf-viewer-container').classList.remove('reader-mode');
            
            pdfCanvas = document.getElementById('pdf-canvas');
            pdfCtx = pdfCanvas.getContext('2d');
            drawCanvas = document.getElementById('draw-canvas');
            drawCtx = drawCanvas.getContext('2d');
            scoreStage = document.getElementById('score-stage');
            scoreStage.style.transformOrigin = 'center center';

            setupDrawingEvents();
            setupScoreGestures();

            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                pdfDoc = await loadingTask.promise;
                await renderPage(pageNum);
                loadSavedAnnotations();
            } catch (error) {
                alert('Σφάλμα φόρτωσης PDF: ' + error.message);
                closePdfViewer();
            }
        }

        function closePdfViewer() {
            document.getElementById('pdf-viewer-container').classList.add('hidden');
            pdfDoc = null;
            pageNum = 1;
            activePieceId = null;
            pinchStartDistance = null;
            pinchStartZoom = null;
            pinchStartMidpoint = null;
            lastScoreTapAt = 0;
        }

        async function renderPage(num) {
            pageRendering = true;
            const page = await pdfDoc.getPage(num);
            const baseViewport = page.getViewport({ scale: 1 });
            const wrapper = document.getElementById('canvas-wrapper');
            const availableWidth = Math.max(280, wrapper.clientWidth - 24);
            minimumScoreScale = Math.max(0.5, availableWidth / baseViewport.width);
            scale = minimumScoreScale;
            const viewport = page.getViewport({ scale: scale });
            const outputScale = window.devicePixelRatio || 1;
            
            pdfCanvas.width = Math.floor(viewport.width * outputScale);
            pdfCanvas.height = Math.floor(viewport.height * outputScale);
            pdfCanvas.style.width = `${viewport.width}px`;
            pdfCanvas.style.height = `${viewport.height}px`;
            drawCanvas.width = Math.floor(viewport.width * outputScale);
            drawCanvas.height = Math.floor(viewport.height * outputScale);
            drawCanvas.style.width = `${viewport.width}px`;
            drawCanvas.style.height = `${viewport.height}px`;

            await page.render({
                canvasContext: pdfCtx,
                viewport,
                transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null
            }).promise;

            pdfCtx.save();
            pdfCtx.setTransform(outputScale, 0, 0, outputScale, 0, 0);
            applyWatermarks(pdfCtx, viewport.width, viewport.height);
            pdfCtx.restore();

            pageRendering = false;
            document.getElementById('page-num-display').innerText = `Σελίδα ${num} / ${pdfDoc.numPages}`;
            scoreZoom = 1;
            scoreStage.style.transformOrigin = 'center center';
            applyScoreZoom();
        }

        function applyScoreZoom() {
            if (scoreStage) {
                scoreStage.style.transform = `scale(${scoreZoom})`;
            }
        }

        function toggleViewerChrome() {
            document.getElementById('pdf-viewer-container').classList.toggle('reader-mode');
        }

        function toggleScoreZoom(x, y) {
            const rect = scoreStage.getBoundingClientRect();
            scoreStage.style.transformOrigin = `${((x - rect.left) / rect.width) * 100}% ${((y - rect.top) / rect.height) * 100}%`;
            scoreZoom = scoreZoom > 1.01 ? 1 : 2;
            applyScoreZoom();
        }

        function getTouchMidpoint(touches) {
            return {
                x: (touches[0].clientX + touches[1].clientX) / 2,
                y: (touches[0].clientY + touches[1].clientY) / 2
            };
        }

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.hypot(dx, dy);
        }

        function setupScoreGestures() {
            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.ontouchstart = (event) => {
                if (event.touches.length !== 2) return;
                event.preventDefault();
                isDrawing = false;
                pinchStartDistance = getTouchDistance(event.touches);
                pinchStartZoom = scoreZoom;
                pinchStartMidpoint = getTouchMidpoint(event.touches);
                const rect = scoreStage.getBoundingClientRect();
                scoreStage.style.transformOrigin = `${((pinchStartMidpoint.x - rect.left) / rect.width) * 100}% ${((pinchStartMidpoint.y - rect.top) / rect.height) * 100}%`;
            };
            wrapper.ontouchmove = (event) => {
                if (event.touches.length !== 2 || !pinchStartDistance || !pinchStartZoom) return;
                event.preventDefault();
                const nextZoom = Math.min(3, Math.max(1, pinchStartZoom * getTouchDistance(event.touches) / pinchStartDistance));
                if (Math.abs(nextZoom - scoreZoom) < 0.01) return;
                scoreZoom = nextZoom;
                applyScoreZoom();
            };
            wrapper.ontouchend = (event) => {
                if (pinchStartDistance) {
                    if (event.touches.length > 0) return;
                    pinchStartDistance = null;
                    pinchStartZoom = null;
                    pinchStartMidpoint = null;
                    return;
                }

                if (!touchWasDrawing && eventChangedTouchesAreScoreTap(event)) {
                    const touch = event.changedTouches[0];
                    const now = Date.now();
                    const isDoubleTap = now - lastScoreTapAt < 300 &&
                        Math.hypot(touch.clientX - lastScoreTapX, touch.clientY - lastScoreTapY) < 30;
                    if (isDoubleTap) {
                        lastScoreTapAt = 0;
                        clearTimeout(scoreTapTimer);
                        toggleScoreZoom(touch.clientX, touch.clientY);
                    } else {
                        lastScoreTapAt = now;
                        lastScoreTapX = touch.clientX;
                        lastScoreTapY = touch.clientY;
                        clearTimeout(scoreTapTimer);
                        scoreTapTimer = setTimeout(toggleViewerChrome, 300);
                    }
                }
            };
        }

        function eventChangedTouchesAreScoreTap(event) {
            return event.changedTouches?.length === 1 && scoreStage && scoreStage.contains(event.target);
        }

        function applyWatermarks(ctx, width, height) {
            const userEmail = currentProfile?.email || currentUser?.email || 'musician';
            const timestamp = new Date().toISOString();

            ctx.save();
            ctx.font = '10px monospace';
            ctx.fillStyle = 'rgba(148, 163, 184, 0.6)';
            ctx.textAlign = 'center';
            const watermarkText = `Licensed exclusively to: ${userEmail} • Φιλαρμονική Ορχήστρα Θήβας`;
            ctx.fillText(watermarkText, width / 2, height - 12);
            ctx.restore();

            const fingerprintString = textToZeroWidth(`UID:${userEmail}|TS:${timestamp}`);
            ctx.save();
            ctx.font = '1px sans-serif';
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillText(fingerprintString, 5, 10);
            ctx.restore();
        }

        function textToZeroWidth(text) {
            const zeroWidthSpace = '\u200B';
            const zeroWidthNonJoiner = '\u200C';
            const zeroWidthJoiner = '\u200D';
            
            return text.split('').map(char => {
                const bin = char.charCodeAt(0).toString(2).padStart(8, '0');
                return bin.split('').map(bit => bit === '1' ? zeroWidthSpace : zeroWidthNonJoiner).join('');
            }).join(zeroWidthJoiner);
        }

        async function changePage(val) {
            if (!pdfDoc || pageRendering) return;
            if (pageNum + val < 1 || pageNum + val > pdfDoc.numPages) return;
            
            savePageToMemory(); 
            pageNum += val;
            await renderPage(pageNum);
            restorePageFromMemory();
        }

        const pageAnnotations = {};

        function savePageToMemory() {
            if (!drawCanvas) return;
            pageAnnotations[pageNum] = drawCanvas.toDataURL();
        }

        function restorePageFromMemory() {
            clearCanvas();
            if (pageAnnotations[pageNum]) {
                const img = new Image();
                img.onload = () => {
                    drawCtx.drawImage(img, 0, 0);
                };
                img.src = pageAnnotations[pageNum];
            }
        }

        function setupDrawingEvents() {
            drawCanvas.onmousedown = startDraw;
            drawCanvas.onmousemove = draw;
            drawCanvas.onmouseup = stopDraw;
            drawCanvas.onmouseleave = stopDraw;

            drawCanvas.ontouchstart = (e) => {
                e.preventDefault();
                touchWasDrawing = false;
                if (e.touches[0]) {
                    touchDrawStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    touchDrawMoved = false;
                }
            };
            drawCanvas.ontouchmove = (e) => {
                e.preventDefault();
                if (!e.touches[0] || !touchDrawStart) return;
                const distance = Math.hypot(
                    e.touches[0].clientX - touchDrawStart.x,
                    e.touches[0].clientY - touchDrawStart.y
                );
                if (!touchDrawMoved && distance > 6) {
                    touchDrawMoved = true;
                    touchWasDrawing = true;
                    startDraw(e.touches[0]);
                }
                if (touchDrawMoved) draw(e.touches[0]);
            };
            drawCanvas.ontouchend = (e) => {
                e.preventDefault();
                if (touchDrawMoved) stopDraw();
                touchDrawStart = null;
                touchDrawMoved = false;
                setTimeout(() => { touchWasDrawing = false; }, 0);
            };
        }

        function getCanvasScaleRatio() {
            if (!drawCanvas) return { scaleX: 1, scaleY: 1 };
            const rect = drawCanvas.getBoundingClientRect();
            return {
                scaleX: drawCanvas.width / rect.width,
                scaleY: drawCanvas.height / rect.height
            };
        }

        function getCanvasCoords(e) {
            if (!drawCanvas) return { x: 0, y: 0 };
            const rect = drawCanvas.getBoundingClientRect();
            const { scaleX, scaleY } = getCanvasScaleRatio();
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function getToolLineWidth() {
            const { scaleX, scaleY } = getCanvasScaleRatio();
            const avgScale = (scaleX + scaleY) / 2 || 1;
            if (currentTool === 'pen') {
                return 3.5 * avgScale;
            }
            return 20 * avgScale;
        }

        function startDraw(e) {
            isDrawing = true;
            drawCtx.beginPath();
            const { x, y } = getCanvasCoords(e);
            drawCtx.moveTo(x, y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const { x, y } = getCanvasCoords(e);

            if (currentTool === 'pen') {
                drawCtx.strokeStyle = '#ef4444';
                drawCtx.lineWidth = getToolLineWidth();
                drawCtx.lineCap = 'round';
                drawCtx.globalCompositeOperation = 'source-over';
            } else {
                drawCtx.lineWidth = getToolLineWidth();
                drawCtx.globalCompositeOperation = 'destination-out';

        function setEventsView(mode) {
            eventsViewMode = mode;
            selectedCalendarDate = null;
            currentCalendarMonth = new Date().getMonth();
            currentCalendarYear = new Date().getFullYear();
            renderEventsTab();
        }

        function changeCalendarMonth(delta) {
            let m = currentCalendarMonth + delta;
            let y = currentCalendarYear;
            if (m < 0) { m = 11; y--; }
            if (m > 11) { m = 0; y++; }
            currentCalendarMonth = m;
            currentCalendarYear = y;
            renderEventsTab();
        }

        function formatGreekDateOnly(dateStr) {
            if (!dateStr) return '';
            const cleanDate = dateStr.split('T')[0];
            const [y, m, d] = cleanDate.split('-');
            if (!y || !m || !d) return dateStr;
            
            const dateObj = new Date(Number(y), Number(m) - 1, Number(d));
            const weekday = dateObj.toLocaleDateString('el-GR', { weekday: 'long' });
            const capitalizedWeekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);
            
            return `${d}/${m}/${y} ${capitalizedWeekday}`;
        }

        function renderCalendarGrid(events) {
            const year = currentCalendarYear;
            const month = currentCalendarMonth;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const startingDay = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;
            const totalDays = new Date(year, month + 1, 0).getDate();

            const monthNames = ["Ιανουάριος", "Φεβρουάριος", "Μάρτιος", "Απρίλιος", "Μάιος", "Ιούνιος", "Ιούλιος", "Αύγουστος", "Σεπτέμβριος", "Οκτώβριος", "Νοέμβριος", "Δεκέμβριος"];
            
            const eventDatesSet = new Set();
            if (events) {
                events.forEach(ev => {
                    if (ev.date) {
                        const dateStr = ev.date.split('T')[0];
                        eventDatesSet.add(dateStr);
                    }
                });
            }

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

            let html = `
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-4">
                    <div class="flex justify-between items-center mb-3">
                        <button onclick="changeCalendarMonth(-1)" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-white text-xs font-semibold">◀ Προηγ.</button>
                        <div class="text-center font-bold text-sm text-indigo-300">${monthNames[month]} ${year}</div>
                        <button onclick="changeCalendarMonth(1)" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-white text-xs font-semibold">Επόμ. ▶</button>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-2">
                        <div>Δευ</div><div>Τρι</div><div>Τετ</div><div>Πεμ</div><div>Παρ</div><div>Σαβ</div><div>Κυρ</div>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-xs">
            `;

            for (let i = 0; i < startingDay; i++) {
                html += `<div></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayStr = String(day).padStart(2, '0');
                const monthStr = String(month + 1).padStart(2, '0');
                const fullDateStr = `${year}-${monthStr}-${dayStr}`;
                const hasEvent = eventDatesSet.has(fullDateStr);
                const isToday = fullDateStr === todayStr;

                let btnClass = "py-2 rounded transition font-medium text-[11px] ";
                if (hasEvent) {
                    btnClass += "bg-indigo-600 text-white font-bold shadow hover:bg-indigo-500 cursor-pointer";
                } else if (isToday) {
                    btnClass += "bg-slate-700 text-amber-300 border border-amber-400/50";
                } else {
                    btnClass += "text-slate-300 hover:bg-slate-700/50";
                }

                if (selectedCalendarDate === fullDateStr) {
                    btnClass = "py-2 rounded bg-emerald-600 text-white font-bold ring-2 ring-white cursor-pointer text-[11px]";
                }

                html += `<button onclick="filterByDate('${fullDateStr}')" class="${btnClass}">${day}</button>`;
            }

            html += `</div></div>`;
            return html;
        }

        function filterByDate(dateStr) {
            selectedCalendarDate = dateStr;
            renderEventsTab();
        }

        async function rsvp(eventId, status) {
            let excuse = null;

            if (status === 'Not Going') {
                excuse = prompt('Παρακαλώ εισάγετε την αιτιολογία για την απουσία σας:');
                if (excuse === null) return; 
                if (excuse.trim() === '') {
                    alert('Η αιτιολογία είναι υποχρεωτική όταν δηλώνετε ότι δεν μπορείτε να παρευρεθείτε.');
                    return;
                }
            } else {
                excuse = ''; 
            }

            const userEmail = currentProfile?.email || currentUser?.email;
            if (!userEmail) {
                alert('Σφάλμα: Δεν βρέθηκε ενεργό email χρήστη.');
                return;
            }

            const { data: existing, error: fetchError } = await supabaseClient
                .from('event_responses')
                .select('*')
                .eq('event_id', eventId)
                .eq('user_email', userEmail)
                .maybeSingle();

            let error;
            if (existing) {
                const res = await supabaseClient
                    .from('event_responses')
                    .update({ status, excuse })
                    .eq('id', existing.id);
                error = res.error;
            } else {
                const res = await supabaseClient
                    .from('event_responses')
                    .insert([{ event_id: eventId, user_email: userEmail, status, excuse }]);
                error = res.error;
            }

            if (error) {
                alert('Σφάλμα αποθήκευσης: ' + error.message);
            } else {
                await renderEventsTab();
            }
        }

        async function addEvent() {
            const event_name = document.getElementById('e-name').value;
            const event_type = document.getElementById('e-type').value;
            const date = document.getElementById('e-date').value;
            const time = document.getElementById('e-time').value;
            const location = document.getElementById('e-loc').value;
            const dress_code = document.getElementById('e-dress').value;
            const notes = document.getElementById('e-notes').value;

            const { error } = await supabaseClient.from('band_events').insert([{ event_name, event_type, date, time, location, dress_code, notes }]);
            if (error) alert(error.message);
            else {
                alert('Η εκδήλωση προστέθηκε!');
                renderEventsTab();
            }
        }

        async function enablePushNotifications() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                alert('Οι ειδοποιήσεις δεν υποστηρίζονται από αυτό το πρόγραμμα περιήγησης.');
                return;
            }

            const appKey = urlB64ToUint8Array(VAPID_PUBLIC_KEY);
            if (!appKey) {
                alert('Το δημόσιο κλειδί VAPID δεν έχει ρυθμιστεί ακόμα.\n\nΕκτελέστε πρώτα το push_notifications/generate_vapid_keys.js και επικολλήστε το δημόσιο κλειδί στη μεταβλητή VAPID_PUBLIC_KEY στο index.html (γραμμή ~104).');
                return;
            }

            try {
                const reg = await registerServiceWorker();
                if (!reg) throw new Error('Δεν ήταν δυνατή η ενεργοποίηση του Service Worker.');
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    alert('Η άδεια ειδοποιήσεων δεν εγκρίθηκε.');
                    return;
                }

                pushSubscription = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: appKey
                });

                const userEmail = currentProfile?.email || currentUser?.email;
                const subJSON = pushSubscription.toJSON();
                const { error: saveErr } = await supabaseClient
                    .from('push_subscriptions')
                    .upsert({
                        user_email: userEmail,
                        user_id: currentUser?.id || null,
                        endpoint: subJSON.endpoint,
                        p256dh_key: subJSON.keys?.p256dh || '',
                        auth_secret: subJSON.keys?.auth  || '',
                        user_agent: navigator.userAgent
                    }, { onConflict: 'endpoint' });

                if (saveErr) throw saveErr;

                alert('✅ Επιτυχής ενεργοποίηση ειδοποιήσεων!\n\nΣημείωση: Για την αποστολή κοινοποιήσεων, ο διαχειριστής τρέχει το push_notifications/send_push_notification.js.');
                renderProfileTab();
            } catch (e) {
                console.error(e);
                alert('Σφάλμα ενεργοποίησης ειδοποιήσεων: ' + e.message);
            }
        }

        async function disablePushNotifications() {
            try {
                if (pushSubscription) {
                    const subJSON = pushSubscription.toJSON();
                    await pushSubscription.unsubscribe().catch(() => {});

                    const { error: delErr } = await supabaseClient
                        .from('push_subscriptions')
                        .delete()
                        .eq('endpoint', subJSON.endpoint);
                    if (delErr) console.warn('DB delete warning:', delErr);
                }
                pushSubscription = null;
                alert('Οι ειδοποιήσεις απενεργοποιήθηκαν.');
                renderProfileTab();
            } catch (e) {
                alert('Σφάλμα απενεργοποίησης: ' + e.message);
            }
        }

        async function sendAdminAnnouncementDirect() {
            const titleEl = document.getElementById('push-title');
            const bodyEl  = document.getElementById('push-body');
            const title = (titleEl.value || '').trim();
            const body  = (bodyEl.value  || '').trim();

            if (!title || !body) { alert('Παρακαλώ συμπληρώστε τίτλο και μήνυμα.'); return; }

            const edgeUrl = PUSH_EDGE_FUNCTION_URL || '';
            if (!urlB64ToUint8Array(VAPID_PUBLIC_KEY)) {
                alert('Το VAPID public key δεν είναι έγκυρο. Πρέπει να είναι το νέο, μεγαλύτερο κλειδί από generate_vapid_keys.js.');
                return;
            }
            if (edgeUrl.length < 10) {
                alert('Δεν έχει οριστεί το URL του Edge Function!\n\nΕνεργοποιήστε το push-sender στο Supabase Dashboard -> Edge Functions και επικολλήστε το URL στη μεταβλητή PUSH_EDGE_FUNCTION_URL στο index.html.');
                return;
            }

            const preview = document.getElementById('push-preview');
            const result  = document.getElementById('push-result');
            preview.classList.remove('hidden');
            preview.className = 'hidden';
            result.classList.remove('hidden');
            result.className = 'text-xs rounded p-2 space-y-1 bg-slate-900 border border-slate-700';
            result.innerHTML = `<span class="text-slate-300">📡 Σύνδεση με τον server...</span>`;

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) throw new Error('Δεν υπάρχει ενεργή σύνδεση.');

                const res = await fetch(edgeUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}`,
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({ title, body, url: './index.html#notifications' })
                });

                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

                const ok = data.sent || 0;
                const fail = data.failed || 0;
                const total = data.total || (ok + fail);
                const note = data.note || '';

                result.className = 'text-xs rounded p-2 space-y-1 bg-emerald-900/40 border border-emerald-700/50';
                result.innerHTML =
                    `<div class="font-bold text-emerald-200">✅ Αποστολή ολοκληρώθηκε</div>` +
                    `<div class="text-emerald-100">Επιτυχείς: <b>${ok}</b> • Αποτυχίες: <b>${fail}</b> • Σύνολο: <b>${total}</b></div>` +
                    (note ? `<div class="text-[11px] text-emerald-200/80 mt-1 italic">${note}</div>` : '') +
                    ((data && data.failed_details && data.failed_details.length) ?
                        `<div class="mt-1 text-[10px] text-emerald-100/80 max-h-16 overflow-auto">Αποτυχίες: ${data.failed_details.map(x => x.email + ' (' + x.reason + ')').join(', ')}</div>` : '');
            } catch (e) {
                result.className = 'text-xs rounded p-2 space-y-1 bg-red-900/40 border border-red-700/50';
                result.innerHTML = `<div class="font-bold text-red-200">❌ Σφάλμα αποστολής</div><div class="text-red-100">${e.message}</div><div class="text-[10px] text-red-200/70 mt-1">Αν το σφάλμα έχει να κάνει με "secrets" ή "VAPID", ελέγξτε αν έχουν οριστεί σωστά τα Secrets στο Edge Function (Supabase Dashboard).</div>`;
            }
        }

        function sendAdminAnnouncementDownloadJSON() {
            const titleEl = document.getElementById('push-title');
            const bodyEl  = document.getElementById('push-body');
            const title = (titleEl.value || '').trim();
            const body  = (bodyEl.value  || '').trim();

            if (!title || !body) { alert('Παρακαλώ συμπληρώστε τίτλο και μήνυμα.'); return; }

            const preview = document.getElementById('push-preview');
            preview.classList.remove('hidden');
            preview.className = 'bg-slate-900 p-2 rounded border border-slate-700 text-xs space-y-1';
            preview.innerHTML = `
                <p class="text-slate-500">Προεπισκόπηση ειδοποίησης:</p>
                <p class="text-white font-bold text-sm">${escapeHtml(title)}</p>
                <p class="text-slate-300 text-[12px]">${escapeHtml(body)}</p>
                <p class="text-[10px] text-amber-400/80 mt-1">⚠️ Αυτό το κουμπί απλά δημιουργεί το αρχείο <b>announcement.json</b>. Για πραγματική αποστολή, χρησιμοποιήστε είτε το <b>send_push_notification.js</b> στον υπολογιστή σας, είτε ενεργοποιήστε το Edge Function για απευθείας αποστολή από το κινητό.</p>
            `;

            const sentBy = currentProfile?.email || currentUser?.email;

            supabaseClient
                .from('push_subscriptions')
                .select('endpoint, p256dh_key, auth_secret, user_email')
                .then(({ data: subs, error }) => {
                    const count = subs?.length || 0;
                    const payload = {
                        announcement: {
                            title, body,
                            url: './index.html#notifications',
                            sent_by_email: sentBy,
                            target_count: count,
                            created_at: new Date().toISOString()
                        },
                        subscriptions: subs || []
                    };
                    downloadJSON(payload, 'announcement.json');
                    alert(`✅ Δημιουργήθηκε το αρχείο announcement.json!\n\nΣτόχοι: ${count} συνδρομητές\n\nΕπόμενο βήμα:\nΜετακινήστε το announcement.json στον φάκελο push_notifications/ και τρέξτε:\n  node send_push_notification.js\n\n(Ή αν έχετε ενεργοποιήσει το Edge Function, χρησιμοποιήστε το κουμπί 🚀 Απευθείας Αποστολή.)`);
                });
        }

        function downloadJSON(obj, filename) {
            const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function renderProfileTab() {
            const content = document.getElementById('content');
            let roleDisplay = currentProfile?.role === 'admin' ? 'Διαχειριστής' : 'Μουσικός';
            
            const firstName = currentProfile?.first_name || currentProfile?.name || '';
            const lastName = currentProfile?.last_name || '';
            const instrument = currentProfile?.instrument || 'Μη ορισμένο';

            const pushSupported = ('serviceWorker' in navigator) && ('PushManager' in window);
            const pushActive = !!pushSubscription;

            let pushSection = '';
            if (pushSupported) {
                if (pushActive) {
                    pushSection = `
                        <div class="bg-emerald-900/30 border border-emerald-700/50 rounded-xl p-4 mb-4">
                            <div class="flex items-start justify-between mb-1">
                                <div>
                                    <h4 class="text-sm font-bold text-emerald-300">🔔 Ειδοποιήσεις Ενεργές</h4>
                                    <p class="text-[11px] text-emerald-400/80 mt-0.5">Θα λαμβάνετε ειδοποιήσεις για νέες ensembles, προβές & ανακοινώσεις.</p>
                                </div>
                                <span class="bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">ON</span>
                            </div>
                            <button onclick="disablePushNotifications()" class="mt-2 w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-red-300 py-2 rounded-lg text-xs font-semibold transition">Απενεργοποίηση Ειδοποιήσεων</button>
                        </div>
                    `;
                } else {
                    pushSection = `
                        <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 mb-4">
                            <div class="flex items-start justify-between mb-1">
                                <div>
                                    <h4 class="text-sm font-bold text-indigo-300">🔔 Push Ειδοποιήσεις</h4>
                                    <p class="text-[11px] text-slate-400 mt-0.5">Ενεργοποιήστε για να λαμβάνετε άμεσες ειδοποιήσεις για νέο πρόγραμμα, σπουδαίες ανακοινώσεις & αλλαγές.</p>
                                </div>
                            </div>
                            <button onclick="enablePushNotifications()" class="mt-2 w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-lg text-xs font-semibold transition">✦ Ενεργοποίηση Ειδοποιήσεων</button>
                        </div>
                    `;
                }
            }

            content.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-2xl font-bold">Το Προφίλ μου</h2>
                </div>
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3 mb-4">
                    <div>
                        <span class="text-xs text-slate-400 block">Όνομα</span>
                        <p class="text-base font-semibold text-white">${escapeHtml(firstName || '—')}</p>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">Επώνυμο</span>
                        <p class="text-base font-semibold text-white">${escapeHtml(lastName || '—')}</p>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">Όργανο / Μέρος</span>
                        <p class="text-base font-semibold text-indigo-300">${escapeHtml(instrument)}</p>
                    </div>
                    <div class="pt-2 border-t border-slate-700">
                        <span class="text-xs text-slate-400 block">Email</span>
                        <p class="text-sm text-slate-300">${escapeHtml(currentProfile?.email || currentUser?.email || '')}</p>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">Ρόλος Συστήματος</span>
                        <span class="inline-block mt-1 uppercase text-xs bg-slate-900 px-2.5 py-1 rounded text-emerald-400 font-medium">${roleDisplay}</span>
                    </div>
                </div>
                ${pushSection}
                <button onclick="handleLogout()" class="w-full bg-red-600/80 hover:bg-red-600 text-white font-semibold p-3 rounded-lg transition text-sm">Αποσύνδεση</button>
            `;
        }

        window.onload = init;
    </script>
