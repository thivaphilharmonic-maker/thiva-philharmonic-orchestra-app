<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Φιλαρμονική Ορχήστρα Θήβας</title>
    
    <!-- PWA / Native App Meta Tags & Dynamic Icon Manifest -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Φιλαρμονική Θήβας">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/thivaphilharmonic-maker/thiva-philharmonic-orchestra-app/main/logo.png">
    <link rel="manifest" id="pwa-manifest">

    <!-- Tailwind CSS for modern mobile-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- PDF.js Library for In-App Rendering & Annotations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <meta name="theme-color" content="#1e293b">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- APP CONTAINER -->
    <div id="app" class="max-w-md mx-auto w-full flex-1 flex flex-col justify-between p-4">
        
        <!-- DYNAMIC CONTENT AREA -->
        <div id="content" class="flex-1 pb-20">
            <!-- Loaded dynamically via JavaScript -->
        </div>

        <!-- NAVIGATION BAR (Visible when logged in) -->
        <nav id="navbar" class="hidden fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 flex justify-around p-3 max-w-md mx-auto z-50">
            <button onclick="switchTab('music')" id="nav-music" class="text-indigo-400 font-medium text-xs">Παρτιτούρες</button>
            <button onclick="switchTab('events')" id="nav-events" class="text-slate-400 font-medium text-xs">Πρόγραμμα</button>
            <button onclick="switchTab('attendance')" id="nav-attendance" class="text-slate-400 font-medium text-xs">Παρουσίες</button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-slate-400 font-medium text-xs">Προφίλ</button>
        </nav>
    </div>

    <!-- PDF VIEWER & ANNOTATION MODAL CONTAINER -->
    <div id="pdf-viewer-container" class="hidden fixed inset-0 bg-slate-950/95 z-50 flex flex-col p-3 max-w-md mx-auto">
        <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-800 mb-2">
            <button onclick="closePdfViewer()" class="text-slate-400 hover:text-white text-xs font-semibold">✕ Κλείσιμο</button>
            <div class="space-x-1.5 text-xs">
                <button onclick="changePage(-1)" class="bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-white">◀ Προηγ.</button>
                <span id="page-num-display" class="text-indigo-300 font-medium">Σελίδα 1 / 1</span>
                <button onclick="changePage(1)" class="bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-white">Επόμ. ▶</button>
            </div>
            <button onclick="clearCanvas()" class="text-red-400 hover:text-red-300 text-xs">Καθαρισμός</button>
        </div>

        <div id="canvas-wrapper" class="relative flex-1 overflow-auto bg-slate-900 rounded-lg border border-slate-800 flex items-center justify-center p-2">
            <canvas id="pdf-canvas" class="shadow-lg max-w-full"></canvas>
            <canvas id="draw-canvas" class="absolute cursor-crosshair touch-none"></canvas>
        </div>

        <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-800 mt-2 text-xs">
            <div class="space-x-1">
                <button onclick="setTool('pen')" id="tool-pen" class="bg-indigo-600 px-3 py-1.5 rounded text-white font-semibold">Πένα</button>
                <button onclick="setTool('eraser')" id="tool-eraser" class="bg-slate-800 px-3 py-1.5 rounded text-slate-300">Γόμα</button>
            </div>
            <button onclick="saveAnnotations()" class="bg-emerald-600 hover:bg-emerald-500 px-3.5 py-1.5 rounded text-white font-semibold">Αποθήκευση</button>
        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        const SUPABASE_URL = 'https://jigwfebaxiqumrltkgli.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ORpUPeW5OSBOwTCTIKhPUw_SX8DtV9Z';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const LOGO_URL = 'https://raw.githubusercontent.com/thivaphilharmonic-maker/thiva-philharmonic-orchestra-app/main/logo.png';

        const manifestData = {
            "name": "Φιλαρμονική Ορχήστρα Θήβας",
            "short_name": "Φιλαρμονική",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#1e293b",
            "icons": [{ "src": LOGO_URL, "sizes": "512x512", "type": "image/png" }]
        };
        document.getElementById('pwa-manifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData));

        let currentUser = null;
        let currentProfile = null;
        let eventsViewMode = 'list'; 
        let selectedCalendarDate = null; 

        // PDF Viewer State variables
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.3;
        let pdfCanvas = null;
        let pdfCtx = null;
        let drawCanvas = null;
        let drawCtx = null;
        let isDrawing = false;
        let currentTool = 'pen';
        let activePieceId = null;

        async function init() {
            if (window.location.hash.includes('type=invite') || window.location.hash.includes('type=recovery')) {
                renderSetPasswordScreen();
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchProfile();
                renderApp();
            } else {
                renderLogin();
            }

            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (event === 'PASSWORD_RECOVERY' || window.location.hash.includes('type=invite')) {
                    renderSetPasswordScreen();
                    return;
                }

                if (session) {
                    currentUser = session.user;
                    await fetchProfile();
                    renderApp();
                } else {
                    currentUser = null;
                    currentProfile = null;
                    renderLogin();
                }
            });
        }

        async function fetchProfile() {
            if (!currentUser) return;
            
            let { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (!data && currentUser.email) {
                const { data: dataByEmail } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('email', currentUser.email)
                    .single();
                if (dataByEmail) data = dataByEmail;
            }

            if (data) {
                currentProfile = data;
            } else {
                currentProfile = { email: currentUser.email, role: 'musician', instrument: 'Μη ορισμένο' };
            }
        }

        function renderLogin() {
            document.getElementById('navbar').classList.add('hidden');
            document.getElementById('content').innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[85vh] text-center">
                    <img src="${LOGO_URL}" alt="Logo" class="w-24 h-24 mb-4 object-contain drop-shadow-md">
                    <h1 class="text-2xl font-bold text-indigo-400 mb-1">Φιλαρμονική Ορχήστρα Θήβας</h1>
                    <p class="text-slate-400 mb-6 text-sm">Συνδεθείτε για να δείτε τις παρτιτούρες σας και το πρόγραμμα.</p>
                    <div class="w-full bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                        <input type="email" id="email" placeholder="Διεύθυνση Email" class="w-full mb-3 p-3 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-indigo-500">
                        <input type="password" id="password" placeholder="Κωδικός πρόσβασης" class="w-full mb-4 p-3 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-indigo-500">
                        <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold p-3 rounded-lg transition text-sm">Σύνδεση</button>
                    </div>
                    <p id="error-msg" class="text-red-400 mt-4 text-sm"></p>
                </div>
            `;
        }

        function renderSetPasswordScreen() {
            document.getElementById('navbar').classList.add('hidden');
            document.getElementById('content').innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[85vh] text-center">
                    <img src="${LOGO_URL}" alt="Logo" class="w-20 h-20 mb-3 object-contain drop-shadow-md">
                    <h1 class="text-2xl font-bold text-indigo-400 mb-2">Δημιουργία Κωδικού Πρόσβασης</h1>
                    <p class="text-slate-400 mb-6 text-sm">Καλώς ήρθατε! Ορίστε τον κωδικό πρόσβασής σας για να ολοκληρώσετε την εγγραφή σας στην εφαρμογή.</p>
                    <div class="w-full bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                        <input type="password" id="new-password" placeholder="Νέος Κωδικός (τουλάχιστον 6 χαρακτήρες)" class="w-full mb-4 p-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 text-sm">
                        <button onclick="handleSetPassword()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold p-3 rounded-lg transition text-sm">Αποθήκευση & Είσοδος</button>
                    </div>
                    <p id="password-error-msg" class="text-red-400 mt-4 text-sm"></p>
                </div>
            `;
        }

        async function handleSetPassword() {
            const password = document.getElementById('new-password').value;
            if (!password || password.length < 6) {
                document.getElementById('password-error-msg').innerText = 'Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.';
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({ password });
            if (error) {
                document.getElementById('password-error-msg').innerText = error.message;
            } else {
                alert('Ο κωδικός αποθηκεύτηκε επιτυχώς!');
                window.location.hash = '';
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    currentUser = session.user;
                    await fetchProfile();
                    renderApp();
                }
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('error-msg').innerText = 'Λανθασμένο email ή κωδικός πρόσβασης.';
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
        }

        let activeTab = 'music';
        function switchTab(tab) {
            activeTab = tab;
            renderApp();
        }

        async function renderApp() {
            document.getElementById('navbar').classList.remove('hidden');
            ['music', 'events', 'attendance', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === activeTab) {
                    btn.className = "text-indigo-400 font-bold text-xs";
                } else {
                    btn.className = "text-slate-400 font-medium text-xs";
                }
            });

            if (!currentProfile && currentUser) {
                await fetchProfile();
            }

            if (activeTab === 'music') renderMusicTab();
            else if (activeTab === 'events') renderEventsTab();
            else if (activeTab === 'attendance') renderAttendanceTab();
            else if (activeTab === 'profile') renderProfileTab();
        }

        // --- MUSIC TAB ---
        async function renderMusicTab() {
            const content = document.getElementById('content');
            content.innerHTML = `<h2 class="text-2xl font-bold mb-4">Παρτιτούρες</h2><p class="text-slate-400 text-sm">Φόρτωση βιβλιοθήκης...</p>`;

            const { data: music, error } = await supabaseClient.from('music_library').select('*');

            if (error) {
                content.innerHTML = `<p class="text-red-400 text-sm">Σφάλμα φόρτωσης: ${error.message}</p>`;
                return;
            }

            let html = `
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="text-2xl font-bold">Παρτιτούρες</h2>
                        <p class="text-xs text-indigo-300">Όργανο: <b>${currentProfile?.instrument || 'Μη ορισμένο'}</b></p>
                    </div>
                    <img src="${LOGO_URL}" alt="Logo" class="w-10 h-10 object-contain">
                </div>
            `;

            if (!music || music.length === 0) {
                html += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center text-slate-400 text-sm">Δεν υπάρχουν διαθέσιμες παρτιτούρες ακόμα.</div>`;
            } else {
                html += `<div class="space-y-3">`;
                music.forEach(item => {
                    const cleanLink = item.pdf_link ? item.pdf_link.replace('/view?usp=sharing', '/uc?export=download') : '';
                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-base text-white">${item.piece_title}</h3>
                                <p class="text-xs text-slate-400">${item.composer || 'Άγνωστος Συνθέτης'} • ${item.instrument_part || item.concert_set || 'Γενικό'}</p>
                            </div>
                            <div class="flex space-x-1.5 shrink-0 ml-2">
                                ${cleanLink ? `<button onclick="openPdfViewer('${cleanLink}', ${item.id})" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-2 rounded-lg text-xs font-semibold transition text-white">Άνοιγμα & Σημειώσεις</button>` : ''}
                                <a href="${item.pdf_link}" target="_blank" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-2 rounded-lg text-xs font-semibold transition text-slate-300" title="Εξωτερικός Σύνδεσμος">🔗</a>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            if (currentProfile?.role === 'admin') {
                html += `
                    <div class="mt-8 bg-slate-800 p-4 rounded-xl border border-slate-700">
                        <h3 class="font-bold text-sm text-indigo-400 mb-3">Διαχειριστής: Προσθήκη Παρτιτούρας</h3>
                        <input type="text" id="m-title" placeholder="Τίτλος Κομματιού" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="m-composer" placeholder="Συνθέτης" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="m-set" placeholder="Σετ Συναυλίας (π.χ., Παρέλαση 28ης)" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="m-part" placeholder="Όργανο / Μέρος (π.χ., Φλάουτο 1)" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="m-link" placeholder="Σύνδεσμος Google Drive (PDF)" class="w-full mb-3 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <button onclick="addMusic()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded font-semibold text-sm">Προσθήκη στη Βιβλιοθήκη</button>
                    </div>
                `;
            }

            content.innerHTML = html;
        }

        async function addMusic() {
            const piece_title = document.getElementById('m-title').value;
            const composer = document.getElementById('m-composer').value;
            const concert_set = document.getElementById('m-set').value;
            const instrument_part = document.getElementById('m-part').value;
            const pdf_link = document.getElementById('m-link').value;

            const { error } = await supabaseClient.from('music_library').insert([{ piece_title, composer, concert_set, instrument_part, pdf_link }]);
            if (error) alert(error.message);
            else {
                alert('Η παρτιτούρα προστέθηκε επιτυχώς!');
                renderMusicTab();
            }
        }

        // --- PDF VIEWER & ANNOTATION LOGIC ---
        async function openPdfViewer(pdfUrl, pieceId) {
            activePieceId = pieceId;
            pageNum = 1;
            document.getElementById('pdf-viewer-container').classList.remove('hidden');
            
            pdfCanvas = document.getElementById('pdf-canvas');
            pdfCtx = pdfCanvas.getContext('2d');
            drawCanvas = document.getElementById('draw-canvas');
            drawCtx = drawCanvas.getContext('2d');

            setupDrawingEvents();

            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                pdfDoc = await loadingTask.promise;
                await renderPage(pageNum);
                loadSavedAnnotations();
            } catch (error) {
                alert('Σφάλμα φόρτωσης PDF: ' + error.message);
                closePdfViewer();
            }
        }

        function closePdfViewer() {
            document.getElementById('pdf-viewer-container').classList.add('hidden');
            pdfDoc = null;
            pageNum = 1;
            activePieceId = null;
        }

        async function renderPage(num) {
            pageRendering = true;
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: scale });
            
            pdfCanvas.height = viewport.height;
            pdfCanvas.width = viewport.width;
            drawCanvas.height = viewport.height;
            drawCanvas.width = viewport.width;

            await page.render({ canvasContext: pdfCtx, viewport: viewport }).promise;
            pageRendering = false;
            
            document.getElementById('page-num-display').innerText = `Σελίδα ${num} / ${pdfDoc.numPages}`;
        }

        async function changePage(val) {
            if (!pdfDoc || pageRendering) return;
            if (pageNum + val < 1 || pageNum + val > pdfDoc.numPages) return;
            
            savePageToMemory(); // Save annotations of current page before switching
            pageNum += val;
            await renderPage(pageNum);
            restorePageFromMemory();
        }

        // Simple in-memory page annotation cache
        const pageAnnotations = {};

        function savePageToMemory() {
            if (!drawCanvas) return;
            pageAnnotations[pageNum] = drawCanvas.toDataURL();
        }

        function restorePageFromMemory() {
            clearCanvas();
            if (pageAnnotations[pageNum]) {
                const img = new Image();
                img.onload = () => {
                    drawCtx.drawImage(img, 0, 0);
                };
                img.src = pageAnnotations[pageNum];
            }
        }

        function setupDrawingEvents() {
            drawCanvas.onmousedown = startDraw;
            drawCanvas.onmousemove = draw;
            drawCanvas.onmouseup = stopDraw;
            drawCanvas.onmouseleave = stopDraw;

            drawCanvas.ontouchstart = (e) => { e.preventDefault(); if(e.touches[0]) startDraw(e.touches[0]); };
            drawCanvas.ontouchmove = (e) => { e.preventDefault(); if(e.touches[0]) draw(e.touches[0]); };
            drawCanvas.ontouchend = (e) => { e.preventDefault(); stopDraw(); };
        }

        function startDraw(e) {
            isDrawing = true;
            drawCtx.beginPath();
            const rect = drawCanvas.getBoundingClientRect();
            drawCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = drawCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (currentTool === 'pen') {
                drawCtx.strokeStyle = '#ef4444'; // Red pen
                drawCtx.lineWidth = 3.5;
                drawCtx.lineCap = 'round';
                drawCtx.globalCompositeOperation = 'source-over';
            } else {
                drawCtx.lineWidth = 20;
                drawCtx.globalCompositeOperation = 'destination-out'; // Erase drawing layer
            }

            drawCtx.lineTo(x, y);
            drawCtx.stroke();
        }

        function stopDraw() {
            isDrawing = false;
        }

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('tool-pen').className = tool === 'pen' ? 'bg-indigo-600 px-3 py-1.5 rounded text-white font-semibold' : 'bg-slate-800 px-3 py-1.5 rounded text-slate-300';
            document.getElementById('tool-eraser').className = tool === 'eraser' ? 'bg-indigo-600 px-3 py-1.5 rounded text-white font-semibold' : 'bg-slate-800 px-3 py-1.5 rounded text-slate-300';
        }

        function clearCanvas() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            delete pageAnnotations[pageNum];
        }

        function saveAnnotations() {
            savePageToMemory();
            const userEmail = currentProfile?.email || currentUser?.email;
            const storageKey = `annotations_${userEmail}_piece_${activePieceId}`;
            localStorage.setItem(storageKey, JSON.stringify(pageAnnotations));
            alert('Οι σημειώσεις αποθηκεύτηκαν επιτυχώς στη συσκευή σας!');
        }

        function loadSavedAnnotations() {
            const userEmail = currentProfile?.email || currentUser?.email;
            const storageKey = `annotations_${userEmail}_piece_${activePieceId}`;
            const saved = localStorage.getItem(storageKey);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    Object.keys(parsed).forEach(p => { pageAnnotations[p] = parsed[p]; });
                    restorePageFromMemory();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        // --- EVENTS TAB ---
        async function renderEventsTab() {
            const content = document.getElementById('content');
            content.innerHTML = `<h2 class="text-2xl font-bold mb-4">Εκδηλώσεις</h2><p class="text-slate-400 text-sm">Φόρτωση προγράμματος...</p>`;

            const { data: events, error: eventError } = await supabaseClient.from('band_events').select('*').order('date', { ascending: true });
            
            if (eventError) {
                content.innerHTML = `<h2 class="text-2xl font-bold mb-4">Εκδηλώσεις</h2><p class="text-red-400 text-sm">Σφάλμα φόρτωσης εκδηλώσεων: ${eventError.message}</p>`;
                return;
            }

            const userEmail = currentProfile?.email || currentUser?.email;
            const { data: responses } = await supabaseClient.from('event_responses').select('*').eq('user_email', userEmail);

            let html = `
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center space-x-2">
                        <img src="${LOGO_URL}" alt="Logo" class="w-8 h-8 object-contain">
                        <h2 class="text-2xl font-bold">Πρόγραμμα</h2>
                    </div>
                    <div class="bg-slate-800 p-1 rounded-lg border border-slate-700 flex space-x-1">
                        <button onclick="setEventsView('list')" class="px-3 py-1 rounded text-xs font-medium transition ${eventsViewMode === 'list' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}">Λίστα</button>
                        <button onclick="setEventsView('calendar')" class="px-3 py-1 rounded text-xs font-medium transition ${eventsViewMode === 'calendar' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}">Ημερολόγιο</button>
                    </div>
                </div>
            `;

            if (eventsViewMode === 'calendar') {
                html += renderCalendarGrid(events);
            }

            let displayedEvents = events || [];
            if (eventsViewMode === 'calendar' && selectedCalendarDate) {
                displayedEvents = displayedEvents.filter(ev => ev.date === selectedCalendarDate);
                html += `
                    <div class="flex justify-between items-center bg-slate-800/60 p-2.5 rounded-lg border border-slate-700 mb-3 text-xs">
                        <span class="text-indigo-300">📅 Προβολή ημέρας: <b>${formatGreekDateOnly(selectedCalendarDate)}</b></span>
                        <button onclick="selectedCalendarDate = null; renderEventsTab();" class="text-slate-400 hover:text-white underline">Εμφάνιση όλων</button>
                    </div>
                `;
            }

            if (!displayedEvents || displayedEvents.length === 0) {
                html += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center text-slate-400 text-sm">Δεν υπάρχουν προγραμματισμένες εκδηλώσεις.</div>`;
            } else {
                html += `<div class="space-y-4">`;
                displayedEvents.forEach(ev => {
                    const myResp = responses?.find(r => r.event_id === ev.id);
                    const myStatus = myResp ? myResp.status : null;

                    const formattedDate = formatGreekDateOnly(ev.date);
                    const dateTimeDisplay = ev.time ? `${formattedDate}, ${ev.time}` : `${formattedDate} (Ώρα αναμένεται)`;

                    let locationHtml = ev.location || 'Θα ανακοινωθεί';
                    if (ev.location && ev.location.includes('|')) {
                        const parts = ev.location.split('|');
                        const locName = parts[0].trim();
                        const locUrl = parts[1].trim();
                        locationHtml = `<a href="${locUrl}" target="_blank" class="text-indigo-400 hover:underline font-medium inline-flex items-center">${locName}</a>`;
                    } else if (ev.location && (ev.location.startsWith('http://') || ev.location.startsWith('https://'))) {
                        locationHtml = `<a href="${ev.location}" target="_blank" class="text-indigo-400 hover:underline">Χάρτης</a>`;
                    }

                    const typeBadge = ev.event_type ? `<span class="bg-slate-700 text-indigo-300 px-2 py-0.5 rounded text-[10px] uppercase font-semibold">${ev.event_type}</span>` : '';

                    let goingBtnClass = "px-3 py-1.5 rounded text-xs font-semibold transition ";
                    let notGoingBtnClass = "px-3 py-1.5 rounded text-xs font-semibold transition ";
                    let statusLabel = '<span class="text-slate-400">Κατάσταση: <b class="text-slate-300">Χωρίς απάντηση</b></span>';

                    if (myStatus === 'Going') {
                        goingBtnClass += "bg-emerald-600 text-white ring-2 ring-white shadow-md font-bold";
                        notGoingBtnClass += "bg-slate-800 text-slate-500 border border-slate-700 opacity-40 hover:opacity-100";
                        statusLabel = '<span class="text-slate-400">Κατάσταση: <b class="text-emerald-400">Θα είμαι εκεί ✅</b></span>';
                    } else if (myStatus === 'Not Going') {
                        goingBtnClass += "bg-slate-800 text-slate-500 border border-slate-700 opacity-40 hover:opacity-100";
                        notGoingBtnClass += "bg-red-600 text-white ring-2 ring-white shadow-md font-bold";
                        statusLabel = `<span class="text-slate-400">Κατάσταση: <b class="text-red-400">Δεν μπορώ ❌</b> <span class="text-[10px] italic">(${myResp.excuse || 'Χωρίς αιτιολογία'})</span></span>`;
                    } else {
                        goingBtnClass += "bg-emerald-600 hover:bg-emerald-500 text-white";
                        notGoingBtnClass += "bg-red-600 hover:bg-red-500 text-white";
                    }

                    html += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="font-bold text-base text-white">${ev.event_name}</h3>
                                ${typeBadge}
                            </div>
                            <p class="text-xs text-indigo-300 mb-1">📅 ${dateTimeDisplay}</p>
                            <p class="text-xs text-slate-400 mb-2">📍 ${locationHtml} | 👔 Ενδυμασία: ${ev.dress_code || 'Καθημερινή'}</p>
                            ${ev.notes ? `<p class="text-xs bg-slate-900 p-2.5 rounded mb-3 text-slate-300">${ev.notes}</p>` : ''}
                            
                            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-t border-slate-700 pt-3 gap-2">
                                <div class="text-xs">${statusLabel}</div>
                                <div class="space-x-1.5 self-end sm:self-auto">
                                    <button onclick="rsvp(${ev.id}, 'Going')" class="${goingBtnClass}">Θα είμαι εκεί</button>
                                    <button onclick="rsvp(${ev.id}, 'Not Going')" class="${notGoingBtnClass}">Δεν μπορώ</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            if (currentProfile?.role === 'admin') {
                html += `
                    <div class="mt-8 bg-slate-800 p-4 rounded-xl border border-slate-700">
                        <h3 class="font-bold text-sm text-indigo-400 mb-3">Διαχειριστής: Νέα Εκδήλωση</h3>
                        <input type="text" id="e-name" placeholder="Όνομα Εκδήλωσης (π.χ., Λιτανεία)" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="e-type" placeholder="Τύπος (π.χ., Παρέλαση, Πρόβα, Συναυλία)" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <div class="grid grid-cols-2 gap-2 mb-2">
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">Ημερομηνία (YYYY-MM-DD)</label>
                                <input type="date" id="e-date" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">Ώρα (Προαιρετικό, π.χ. 18:30)</label>
                                <input type="text" id="e-time" placeholder="π.χ. 18:30" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                            </div>
                        </div>
                        <input type="text" id="e-loc" placeholder="Τοποθεσία | URL (π.χ., Συνεδριακό | https://maps...)" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <input type="text" id="e-dress" placeholder="Ενδυμασία (π.χ., Στολή Παρέλασης)" class="w-full mb-2 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white">
                        <textarea id="e-notes" placeholder="Επιπλέον σημειώσεις..." class="w-full mb-3 p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white"></textarea>
                        <button onclick="addEvent()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded font-semibold text-sm">Προγραμματισμός</button>
                    </div>
                `;
            }

            content.innerHTML = html;
        }

        // --- ATTENDANCE TAB ---
        async function renderAttendanceTab() {
            const content = document.getElementById('content');
            content.innerHTML = `<h2 class="text-2xl font-bold mb-4">Παρουσίες</h2><p class="text-slate-400 text-sm">Φόρτωση αναφοράς...</p>`;

            const { data: events, error: eventError } = await supabaseClient.from('band_events').select('*').order('date', { ascending: true });
            const { data: responses, error: respError } = await supabaseClient.from('event_responses').select('*');

            if (eventError || respError) {
                content.innerHTML = `<h2 class="text-2xl font-bold mb-4">Παρουσίες</h2><p class="text-red-400 text-sm">Σφάλμα φόρτωσης δεδομένων.</p>`;
                return;
            }

            const isAdmin = currentProfile?.role === 'admin';

            let html = `
                <div class="flex items-center justify-between mb-1">
                    <h2 class="text-2xl font-bold">Παρουσίες</h2>
                    <img src="${LOGO_URL}" alt="Logo" class="w-8 h-8 object-contain">
                </div>
            `;
            
            if (isAdmin) {
                html += `<p class="text-xs text-slate-400 mb-4">Συγκεντρωτική κατάσταση συμμετοχών για όλους τους μουσικούς (Admin View).</p>`;

                if (!events || events.length === 0) {
                    html += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center text-slate-400 text-sm">Δεν υπάρχουν εκδηλώσεις.</div>`;
                } else {
                    html += `<div class="space-y-4">`;
                    events.forEach(ev => {
                        const eventResponses = responses?.filter(r => r.event_id === ev.id) || [];
                        const goingList = eventResponses.filter(r => r.status === 'Going');
                        const notGoingList = eventResponses.filter(r => r.status === 'Not Going');

                        const formattedDate = formatGreekDateOnly(ev.date);
                        const dateTimeDisplay = ev.time ? `${formattedDate}, ${ev.time}` : `${formattedDate} (Ώρα αναμένεται)`;
                        const typeBadge = ev.event_type ? `<span class="bg-slate-700 text-indigo-300 px-2 py-0.5 rounded text-[10px] uppercase font-semibold">${ev.event_type}</span>` : '';

                        html += `
                            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="font-bold text-base text-white">${ev.event_name}</h3>
                                    ${typeBadge}
                                </div>
                                <p class="text-xs text-indigo-300 mb-3">📅 ${dateTimeDisplay}</p>
                                
                                <div class="grid grid-cols-2 gap-2 mb-3 text-xs">
                                    <div class="bg-slate-900 p-2.5 rounded border border-slate-700/60">
                                        <span class="text-emerald-400 font-semibold block mb-1">✅ Θα πάνε (${goingList.length})</span>
                                        ${goingList.length === 0 ? '<span class="text-slate-500 italic">Καμία δήλωση</span>' : 
                                          goingList.map(r => `<div class="text-slate-300 truncate">• ${r.user_email}</div>`).join('')}
                                    </div>
                                    <div class="bg-slate-900 p-2.5 rounded border border-slate-700/60">
                                        <span class="text-red-400 font-semibold block mb-1">❌ Απόντες (${notGoingList.length})</span>
                                        ${notGoingList.length === 0 ? '<span class="text-slate-500 italic">Κανένας</span>' : 
                                          notGoingList.map(r => `<div class="text-slate-300 mb-1">• <b>${r.user_email}</b><br><span class="text-[10px] text-slate-400 italic">"${r.excuse || 'Χωρίς αιτιολογία'}"</span></div>`).join('')}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
            } else {
                html += `<p class="text-xs text-slate-400 mb-4">Το προσωπικό σας ιστορικό συμμετοχών και αιτιολογιών απουσίας.</p>`;

                const userEmail = currentProfile?.email || currentUser?.email;
                const myResponses = responses?.filter(r => r.user_email === userEmail) || [];
                const totalEventsCount = events?.length || 0;
                const attendedCount = myResponses.filter(r => r.status === 'Going').length;
                const absentCount = myResponses.filter(r => r.status === 'Not Going').length;
                const pendingCount = totalEventsCount - (attendedCount + absentCount);

                html += `
                    <div class="grid grid-cols-3 gap-2 mb-4 text-center">
                        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                            <span class="text-xs text-slate-400 block mb-1">Παρουσίες</span>
                            <span class="text-lg font-bold text-emerald-400">${attendedCount}</span>
                        </div>
                        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                            <span class="text-xs text-slate-400 block mb-1">Απουσίες</span>
                            <span class="text-lg font-bold text-red-400">${absentCount}</span>
                        </div>
                        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                            <span class="text-xs text-slate-400 block mb-1">Χωρίς απάντηση</span>
                            <span class="text-lg font-bold text-slate-300">${pendingCount}</span>
                        </div>
                    </div>

                    <h3 class="font-bold text-sm text-indigo-300 mb-3">Ιστορικό Αιτιολογιών Απουσίας</h3>
                `;

                const myAbsencesWithExcuses = myResponses.filter(r => r.status === 'Not Going');

                if (myAbsencesWithExcuses.length === 0) {
                    html += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center text-slate-400 text-sm">Δεν έχετε καταχωρημένες απουσίες με αιτιολογία.</div>`;
                } else {
                    html += `<div class="space-y-3">`;
                    myAbsencesWithExcuses.forEach(resp => {
                        const ev = events?.find(e => e.id === resp.event_id);
                        const eventName = ev ? ev.event_name : 'Άγνωστη Εκδήλωση';
                        const eventDate = ev ? formatGreekDateOnly(ev.date) : '';

                        html += `
                            <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 text-xs">
                                <div class="flex justify-between items-start mb-1">
                                    <span class="font-bold text-white text-sm">${eventName}</span>
                                    <span class="text-indigo-300">${eventDate}</span>
                                </div>
                                <p class="text-slate-400 mt-1">Αιτιολογία: <span class="text-slate-200 italic">"${resp.excuse || 'Χωρίς αιτιολογία'}"</span></p>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
            }

            content.innerHTML = html;
        }

        function setEventsView(mode) {
            eventsViewMode = mode;
            selectedCalendarDate = null;
            renderEventsTab();
        }

        function formatGreekDateOnly(dateStr) {
            if (!dateStr) return '';
            const cleanDate = dateStr.split('T')[0];
            const [y, m, d] = cleanDate.split('-');
            if (!y || !m || !d) return dateStr;
            
            const dateObj = new Date(Number(y), Number(m) - 1, Number(d));
            const weekday = dateObj.toLocaleDateString('el-GR', { weekday: 'long' });
            const capitalizedWeekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);
            
            return `${d}/${m}/${y} ${capitalizedWeekday}`;
        }

        function renderCalendarGrid(events) {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();

            const firstDayIndex = new Date(year, month, 1).getDay();
            const startingDay = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;
            const totalDays = new Date(year, month + 1, 0).getDate();

            const monthNames = ["Ιανουάριος", "Φεβρουάριος", "Μάρτιος", "Απρίλιος", "Μάιος", "Ιούνιος", "Ιούλιος", "Αύγουστος", "Σεπτέμβριος", "Οκτώβριος", "Νοέμβριος", "Δεκέμβριος"];
            
            const eventDatesSet = new Set();
            if (events) {
                events.forEach(ev => {
                    if (ev.date) {
                        const dateStr = ev.date.split('T')[0];
                        eventDatesSet.add(dateStr);
                    }
                });
            }

            let html = `
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-4">
                    <div class="text-center font-bold text-sm text-indigo-300 mb-3">${monthNames[month]} ${year}</div>
                    <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-2">
                        <div>Δευ</div><div>Τρι</div><div>Τετ</div><div>Πεμ</div><div>Παρ</div><div>Σαβ</div><div>Κυρ</div>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-xs">
            `;

            for (let i = 0; i < startingDay; i++) {
                html += `<div></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayStr = String(day).padStart(2, '0');
                const monthStr = String(month + 1).padStart(2, '0');
                const fullDateStr = `${year}-${monthStr}-${dayStr}`;
                const hasEvent = eventDatesSet.has(fullDateStr);

                let btnClass = "py-2 rounded transition font-medium ";
                if (hasEvent) {
                    btnClass += "bg-indigo-600 text-white font-bold shadow hover:bg-indigo-500 cursor-pointer";
                } else {
                    btnClass += "text-slate-300 hover:bg-slate-700/50";
                }

                if (selectedCalendarDate === fullDateStr) {
                    btnClass = "py-2 rounded bg-emerald-600 text-white font-bold ring-2 ring-white cursor-pointer";
                }

                html += `<button onclick="filterByDate('${fullDateStr}')" class="${btnClass}">${day}</button>`;
            }

            html += `</div></div>`;
            return html;
        }

        function filterByDate(dateStr) {
            selectedCalendarDate = dateStr;
            renderEventsTab();
        }

        async function rsvp(eventId, status) {
            let excuse = null;

            if (status === 'Not Going') {
                excuse = prompt('Παρακαλώ εισάγετε την αιτιολογία για την απουσία σας:');
                if (excuse === null) return; 
                if (excuse.trim() === '') {
                    alert('Η αιτιολογία είναι υποχρεωτική όταν δηλώνετε ότι δεν μπορείτε να παρευρεθείτε.');
                    return;
                }
            } else {
                excuse = ''; 
            }

            const userEmail = currentProfile?.email || currentUser?.email;
            if (!userEmail) {
                alert('Σφάλμα: Δεν βρέθηκε ενεργό email χρήστη.');
                return;
            }

            const { data: existing, error: fetchError } = await supabaseClient
                .from('event_responses')
                .select('*')
                .eq('event_id', eventId)
                .eq('user_email', userEmail)
                .maybeSingle();

            let error;
            if (existing) {
                const res = await supabaseClient
                    .from('event_responses')
                    .update({ status, excuse })
                    .eq('id', existing.id);
                error = res.error;
            } else {
                const res = await supabaseClient
                    .from('event_responses')
                    .insert([{ event_id: eventId, user_email: userEmail, status, excuse }]);
                error = res.error;
            }

            if (error) {
                alert('Σφάλμα αποθήκευσης: ' + error.message);
            } else {
                await renderEventsTab();
            }
        }

        async function addEvent() {
            const event_name = document.getElementById('e-name').value;
            const event_type = document.getElementById('e-type').value;
            const date = document.getElementById('e-date').value;
            const time = document.getElementById('e-time').value;
            const location = document.getElementById('e-loc').value;
            const dress_code = document.getElementById('e-dress').value;
            const notes = document.getElementById('e-notes').value;

            const { error } = await supabaseClient.from('band_events').insert([{ event_name, event_type, date, time, location, dress_code, notes }]);
            if (error) alert(error.message);
            else {
                alert('Η εκδήλωση προστέθηκε!');
                renderEventsTab();
            }
        }

        // --- PROFILE TAB ---
        function renderProfileTab() {
            const content = document.getElementById('content');
            let roleDisplay = currentProfile?.role === 'admin' ? 'Διαχειριστής' : 'Μουσικός';
            
            const firstName = currentProfile?.first_name || currentProfile?.name || '';
            const lastName = currentProfile?.last_name || '';
            const instrument = currentProfile?.instrument || 'Μη ορισμένο';

            content.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-2xl font-bold">Το Προφίλ μου</h2>
                    <img src="${LOGO_URL}" alt="Logo" class="w-10 h-10 object-contain">
                </div>
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3 mb-4">
                    <div>
                        <span class="text-xs text-slate-400 block">Όνομα</span>
                        <p class="text-base font-semibold text-white">${firstName || '—'}</p>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">Επώνυμο</span>
                        <p class="text-base font-semibold text-white">${lastName || '—'}</p>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">Όργανο / Μέρος</span>
                        <p class="text-base font-semibold text-indigo-300">${instrument}</p>
                    </div>
                    <div class="pt-2 border-t border-slate-700">
                        <span class="text-xs text-slate-400 block">Email</span>
                        <p class="text-sm text-slate-300">${currentProfile?.email || currentUser?.email}</p>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">Ρόλος Συστήματος</span>
                        <span class="inline-block mt-1 uppercase text-xs bg-slate-900 px-2.5 py-1 rounded text-emerald-400 font-medium">${roleDisplay}</span>
                    </div>
                </div>
                <button onclick="handleLogout()" class="w-full bg-red-600/80 hover:bg-red-600 text-white font-semibold p-3 rounded-lg transition text-sm">Αποσύνδεση</button>
            `;
        }

        window.onload = init;
    </script>
</body>
</html>
